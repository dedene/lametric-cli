version: 2
project_name: lametric

builds:
  - id: lametric
    main: ./cmd/lametric
    binary: lametric
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
    ldflags:
      - -s -w
      - -X github.com/dedene/lametric-cli/internal/cmd.version={{ .Tag }}
      - -X github.com/dedene/lametric-cli/internal/cmd.commit={{ .ShortCommit }}
      - -X github.com/dedene/lametric-cli/internal/cmd.date={{ .Date }}

  - id: lametric_darwin
    main: ./cmd/lametric
    binary: lametric
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64
    ldflags:
      - -s -w
      - -X github.com/dedene/lametric-cli/internal/cmd.version={{ .Tag }}
      - -X github.com/dedene/lametric-cli/internal/cmd.commit={{ .ShortCommit }}
      - -X github.com/dedene/lametric-cli/internal/cmd.date={{ .Date }}

archives:
  - ids:
      - lametric
      - lametric_darwin
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

brews:
  - repository:
      owner: dedene
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/dedene/lametric-cli
    description: CLI for LaMetric TIME/SKY - control your device from the command line
    license: MIT
    install: |
      bin.install "lametric"
    test: |
      system "#{bin}/lametric", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
